packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  cpu-features: false
  protobufjs: false
  ssh2: false

# `pnpm audit:deps` (and the Audit workflow) fail on high or critical advisories. An advisory is
# ignored here only when it has no fixed release and cannot reach this app; remove each entry as
# soon as a fix is published (Dependabot then raises the update). README "Dependency audit".
auditConfig:
  ignoreGhsas:
    # picomatch <=4.0.7 ReDoS through extglobs, no patched release yet (4.0.7 is the latest).
    # Dev tooling only (vite, vitest, eslint, tailwind): it matches glob patterns from this repo's
    # own config, never a request or an uploaded file. `pnpm audit --prod` does not list it.
    - GHSA-fc5q-39xc-vjpf
