name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI only checks code, it never writes to the repo.
permissions:
  contents: read

# A newer push to the same PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Corepack would otherwise stop and ask before downloading the pinned pnpm.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      # Actions are pinned to commit SHAs so a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # pnpm comes from the packageManager field, same as on a developer machine.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm lint

      # Testcontainers starts real Postgres containers through the runner's Docker.
      - run: pnpm test

      - run: pnpm build

  # Builds the production images (Dockerfile targets api and web) and runs them together with
  # Postgres, checking health, Caddy's headers and SPA fallback, non-root users, image contents and
  # graceful shutdown. Then runs the production compose stack (compose.prod.yml) over HTTPS with
  # Caddy's local CA: redirect, HSTS, migrate, create-admin, reachability, body limit, log
  # rotation and data/certificates surviving restarts. The second build reuses the first one's
  # BuildKit cache. Plain docker CLI, no extra actions. amd64 only: the arm64 host builds its own
  # images and is not exercised here.
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: scripts/smoke-images.sh

      - run: scripts/smoke-compose.sh
