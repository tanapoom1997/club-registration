name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI only checks code, it never writes to the repo.
permissions:
  contents: read

# A newer push to the same PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Corepack would otherwise stop and ask before downloading the pinned pnpm.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      # Actions are pinned to commit SHAs so a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The repo is public: fail before anything else if git tracks a spreadsheet, dump, archive or
      # env file that could hold real data (.gitignore can be bypassed with git add -f).
      - run: scripts/check-no-data-files.sh

      # The Ubuntu 24.04 package, the same version a developer on 24.04 gets from apt. Installed
      # only if the runner image does not already ship it.
      - name: Install ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends shellcheck
          fi

      # Every tracked shell script: backup/restore handle production data, the smoke scripts gate
      # every PR. Needs no Node, so it runs before setup.
      - run: scripts/lint-shell.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # pnpm comes from the packageManager field, same as on a developer machine.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm lint

      # Testcontainers starts real Postgres containers through the runner's Docker.
      - run: pnpm test

      - run: pnpm build

  # Browser tests (e2e/): Chromium drives the web app against the api and a real Postgres together
  # (login, first-login password change, register and cancel, a full club, role redirects). The
  # suite starts its own Postgres (Testcontainers), api and web dev server; see e2e/global-setup.ts.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      # The Chromium build that the pinned @playwright/test expects, with its system libraries.
      - run: pnpm --filter @club-registration/e2e exec playwright install --with-deps chromium

      - run: pnpm e2e

  # Builds the production images (Dockerfile targets api and web) and runs them together with
  # Postgres, checking health, Caddy's headers and SPA fallback, non-root users, image contents and
  # graceful shutdown. Then runs the production compose stack (compose.prod.yml) over HTTPS with
  # Caddy's local CA: redirect, HSTS, migrate, create-admin, reachability, body limit, log
  # rotation and data/certificates surviving restarts. Then backs up and restores that stack
  # (scripts/backup.sh, scripts/restore.sh) against a local MinIO as S3, using the runner's
  # preinstalled AWS CLI. Later builds reuse the first one's BuildKit cache. Plain docker CLI, no
  # extra actions. amd64 only: the arm64 host builds its own images and is not exercised here.
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: scripts/smoke-images.sh

      - run: scripts/smoke-compose.sh

      - run: scripts/smoke-backup.sh
