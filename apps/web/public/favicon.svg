<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The header's BrandMark as a tab icon. Fixed colours: an icon file cannot read the page's
       CSS tokens. #4f46e5 and #8f38ed are the primary and brand tokens in src/index.css. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5" />
      <stop offset="1" stop-color="#8f38ed" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)" />
  <g transform="translate(14 14) scale(1.5)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="7" height="7" rx="1.5" />
    <rect x="14" y="3" width="7" height="7" rx="1.5" />
    <rect x="3" y="14" width="7" height="7" rx="1.5" />
    <path d="m14.5 17.5 2 2 4-4" />
  </g>
</svg>
